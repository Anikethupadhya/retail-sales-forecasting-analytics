name: Portfolio checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.3'
          cache: pip
      - name: Install exact Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify dependencies
        run: python -m pip check
      - name: Fixture and unit checks
        run: python -m pytest -q -m 'not integration and not dashboard'
      - name: Customer-free saved-output integration
        run: python -m pytest -q -m integration
      - name: Saved-output dashboard smoke
        run: python -m pytest -q -m dashboard
